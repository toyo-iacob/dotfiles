# Herdr config — mirrors ~/work/personal/dotfiles/tmux bindings as closely as possible.
# Docs: https://herdr.dev/docs/config-reference/
# Reload after edits: herdr server reload-config   (or prefix+i)

onboarding = false

[terminal]
new_cwd = "follow"              # like tmux `new-window -c "#{pane_current_path}"`

[theme]
name = "catppuccin"             # matches tmux catppuccin plugin

[ui]
tab_bar_position = "top"        # matches `status-position top`
prompt_new_tab_name = false     # tmux `c` creates a window without prompting
confirm_close = true
copy_on_select = true           # tmux-yank: mouse selection copies automatically
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" },
]
# weather equivalent of xamut/tmux-weather — point at a script printing one line:
# { type = "command", command = "~/.config/herdr/weather.sh", interval_seconds = 600, timeout_seconds = 5 }

status_indicators = "symbols"
[session]
resume_agents_on_restore = true # tmux-resurrect/continuum equivalent (built-in)

[keys]
# tmux prefix is default ctrl+b — same as herdr default. Left unchanged.
# prefix = "ctrl+b"

# --- session / workspace (tmux session ≈ herdr workspace) ---
reload_config      = "prefix+i"        # tmux: i → source-file
detach             = "prefix+D"        # tmux: D → detach
workspace_picker   = ""                  # dropped: Navigator plugin (prefix+f) covers it
rename_workspace   = "prefix+R"        # tmux: R → rename-session
new_workspace      = "prefix+C"        # tmux: C → new-session
close_workspace    = "prefix+X"        # tmux: X → kill-session
goto               = ""                  # dropped: Navigator plugin (prefix+f) covers it
# navigate_mode keys: herdr defaults (no custom shortcuts; picker unused/mouse)

# --- windows / tabs ---
new_tab            = "prefix+c"        # tmux: c → new-window (herdr default)
rename_tab         = "prefix+r"        # tmux: r → rename-window
previous_tab       = "prefix+H"        # tmux: H → previous-window
next_tab           = "prefix+L"        # tmux: L → next-window
move_tab_previous  = "prefix+J"        # tmux: J → swap-window -t -1
move_tab_next      = "prefix+K"        # tmux: K → swap-window -t +1
close_tab          = "prefix+ampersand"  # tmux default kill-window = &
switch_tab         = "prefix+1..9"     # tmux: 0-9 → select-window (herdr supports 1-9 only)

# --- panes ---
split_vertical     = "prefix+d"        # tmux: d → split-window -h (side by side)
split_horizontal   = "prefix+s"        # tmux: s → split-window -v (stacked)
# focus_pane_* unset: ctrl+h/j/k/l (vim-herdr-navigation) covers pane focus
focus_pane_left    = ""
focus_pane_down    = ""
focus_pane_up      = ""
focus_pane_right   = ""
zoom               = "prefix+z"        # tmux: z → resize-pane -Z
close_pane         = ""                # unset: prefix+x is the guarded custom command below; last-pane closes go through prefix+shift+x (close_workspace, with native confirm)

# pane resizing on arrows
resize_pane_left   = "prefix+left"
resize_pane_right  = "prefix+right"
resize_pane_down   = "prefix+down"
resize_pane_up     = "prefix+up"
resize_mode        = "prefix+t"        # modal resize: arrows/hjkl repeat, Esc exits; t = transform

# --- copy mode ---
copy_mode          = "prefix+v"        # tmux: v → copy-mode
# herdr copy mode is already vi-style: v/Space select, y/Enter copy, q/Esc quit

# --- moved defaults (conflicts with the tmux-style map above) ---
settings           = "prefix+!"        # moved off prefix+s (split_horizontal)
help               = "prefix+?"        # herdr default
rename_pane        = "prefix+p"        # moved off herdr default shift+p
# new_worktree: herdr default prefix+shift+g (reviewr owns prefix+g)
open_notification_target = "prefix+n"  # jump to the pane behind the visible toast (n = notification)

# Guarded close-pane: refuses to close the last pane of a workspace
# (herdr closes the whole workspace silently in that case, bypassing
# ui.confirm_close) and plays a sound instead.
# To close the workspace (last pane), use prefix+shift+x (close_workspace).
[[keys.command]]
key = "prefix+x"
type = "shell"
command = "~/.config/herdr/guard-close-pane.sh"
description = "close pane (guarded on last pane)"

# --- plugins ---

# annotate (plannotator/herdr-annotate, full install)
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate: annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "annotate: copy as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "annotate: copy as context and archive"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "annotate: manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "annotate: review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "annotate: review agent's last reply"

[[keys.command]]
key = "prefix+shift+p"
type = "shell"
command = "~/.claude/hooks/reopen-plan-in-annotator.sh"
description = "annotate: reopen latest plan (after closing its pane)"

# herdr-navigator (fuzzy jump to workspaces/agents/sessions/dirs)
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-navigator.open"
description = "nav: jump to anything"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "nav: toggle previous workspace"

# memex (agent session history: search, browse, resume)
[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "nicosuave.memex.palette"
description = "memex: session palette (history)"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "nicosuave.memex.resume-last"
description = "memex: resume last session for this dir"

# reviewr (diff review pane beside the agent)
[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle diff review pane"

# vim-herdr-navigation (seamless nvim split <-> herdr pane C-hjkl)
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "vim-nav: left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "vim-nav: down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "vim-nav: up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "vim-nav: right"

# lazygit-style popup example:
# [[keys.command]]
# key = "prefix+alt+g"
# type = "popup"
# command = "lazygit"
# description = "run lazygit"

[ui.toast]
delivery = "herdr"
